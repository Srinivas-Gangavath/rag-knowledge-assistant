services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      STORAGE_PATH: ${STORAGE_PATH}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      CHUNKING_STRATEGY: ${CHUNKING_STRATEGY:-fixed_word_window}
      RAG_TOP_K: ${RAG_TOP_K}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-dense}
      HYBRID_CANDIDATE_K: ${HYBRID_CANDIDATE_K:-20}
      HYBRID_RRF_K: ${HYBRID_RRF_K:-60}
      RERANKING_ENABLED: ${RERANKING_ENABLED:-false}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_CANDIDATE_K: ${RERANK_CANDIDATE_K:-20}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-16}
      RERANK_MAX_CHARS: ${RERANK_MAX_CHARS:-24000}
      RERANKING_FALLBACK: ${RERANKING_FALLBACK:-true}
      HF_HOME: /cache/huggingface
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
      CONVERSATION_HISTORY_LIMIT: ${CONVERSATION_HISTORY_LIMIT:-10}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-20000}
      GEMINI_RETRY_ATTEMPTS: ${GEMINI_RETRY_ATTEMPTS:-2}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/storage
      - huggingface_cache:/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "if [ ! -x node_modules/.bin/vite ]; then
               echo 'Installing frontend dependencies (first run can take a few minutes)...';
               npm install;
             else
               echo 'Frontend dependencies already installed.';
             fi &&
             echo 'Starting Vite dev server on http://0.0.0.0:5173 ...' &&
             npm run dev"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  postgres_data:
  frontend_node_modules:
  huggingface_cache:
